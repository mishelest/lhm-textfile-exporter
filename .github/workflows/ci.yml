name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  imports:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "import main; import exporter_service; print('imports ok')"
